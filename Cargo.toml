[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/core",
    "crates/userspace",
]
# crates/ebpf targets bpfel-unknown-none (nightly + bpf-linker) and is built out-of-band
# by crates/userspace/build.rs via aya-build. Excluding it keeps host `cargo build`/`cargo test`
# from trying to compile the BPF object with the default target.
#
# xtask is the developer-tool crate (`cargo xtask viz-snapshot`, see xtask/README.md). It is its own
# workspace with its own lockfile, so its clap/anyhow — and, under xtask/viz-web, the whole
# ratzilla + wasm32 tree — never enter the shipping crates' dependency graph. Excluding it is what
# keeps `cargo build`/`cargo test`/`cargo clippy --workspace --all-targets` byte-for-byte unaffected
# by its existence.
exclude = ["crates/ebpf", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Jared Gore"]
repository = "https://github.com/jaredgore/bee"
rust-version = "1.85"

[workspace.dependencies]
# Shared POD map layouts (no_std) live here; both user-space and eBPF depend on it.
bee-common = { path = "crates/common" }
bee-core = { path = "crates/core" }
bee-userspace = { path = "crates/userspace" }

# User-space eBPF stack (stable Rust).
aya = "0.14"
aya-build = "0.2"

# LLM provider abstraction (application package only). Async; tokio-required.
rig-core = "0.40"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util"] }
async-trait = "0.1"

# Serialization / policy.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# YAML — only for SKILL.md frontmatter (006-skills, application only). `serde_yaml` is archived; this
# is its maintained drop-in continuation with the identical serde API.
serde_yaml_ng = "0.10"

# Syscalls (cgroup, prctl, name_to_handle_at, fork/exec).
nix = { version = "0.29", features = ["fs", "process", "sched", "resource", "user", "mount"] }
libc = "0.2"

# CLI.
clap = { version = "4", features = ["derive"] }

# Errors / time.
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }

# Dev/test.
proptest = "1"
criterion = "0.5"

[profile.release]
lto = true
codegen-units = 1

[package]
name = "bee"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# NOT `rust-version.workspace = true` (which is 1.85, kept for the embeddable core crates).
# `ast-grep-core` 0.45 — behind the default-off `astgrep` feature — declares 1.88, and Cargo cannot
# express a per-feature floor. Splitting the promise by audience is the honest encoding: embedders
# of bee-core/bee-common/bee-userspace keep 1.85; operators building this binary need 1.88
# (016-native-tools research R3).
rust-version = "1.88"
description = "Kernel-enforced, capability-scoped sandboxing for AI coding agents."

# The application package: the `bee` executable and the harness library it drives. They are one
# package because the library has exactly one consumer (ADR-0002, consolidation issue 08). The
# library is `src/lib.rs` and everything beside it; the application layer — commands, the
# configuration resolver, session construction — is `src/app/`, reached only from `src/main.rs`.
[[bin]]
name = "bee"
path = "src/main.rs"

[lib]
name = "bee"
path = "src/lib.rs"

[features]
default = ["tui"]
# Real kernel enforcement. Pulls bee-userspace's eBPF-LSM path (nightly bpf toolchain + BPF-LSM
# kernel to build/attach). WITHOUT this feature the harness runs tools as hardened, credential-
# stripped host processes with NO scope — enough for offline (MockModel) tests and live-provider
# smoke, and keeping the default workspace build runtime-/bpf-toolchain-free (Constitution V, SC-005).
enforce = ["bee-userspace/enforce"]
# Concurrent batch episodes: the async audit demux + shared-engine runner.
# Concurrent episodes (US4): the async audit demux + shared-engine runner. Pulls bee-userspace's
# `tokio` feature (which implies `enforce`) and turns on the harness `enforce` path it builds on.
# Kept separate from `enforce` so the plain enforce build stays async-runtime-free (SC-005).
concurrent = ["enforce", "bee-userspace/tokio"]
# MCP client (004-mcp-client). Default-off so the plain build stays rmcp-free (NFR-004/006, SC-026/027):
# no MCP code compiles and `rmcp` never enters bee-core/bee-common's tree unless this is enabled. Gates
# the optional `rmcp` dep below. Stdio (`transport-child-process`) ships first; the remote
# Streamable-HTTP transport feature is added with the domain-gating slice (US9, task T024).
mcp = ["dep:rmcp"]
# Full-screen TUI front-end (008-grid-tui, M3–M4). Default-off so the plain build stays headless and
# free of a terminal backend (Constitution V / SC-005): turns on ratatui's crossterm backend and pulls
# the optional terminal deps below. Without it, `viz::buffer_render` keeps using the headless Buffer
# and `bee-repl` runs the inline REPL only. 009 adds tachyonfx here too, so the effects pipeline is
# compiled only in full-screen builds.
tui = [
    "dep:crossterm",
    "dep:color-eyre",
    "dep:textwrap",
    "dep:tachyonfx",
    "dep:tui-markdown",
    "ratatui/crossterm",
    "tokio/sync",
]

# ── Security analysis tooling (016-native-tools) ────────────────────────────────────────────────
# Each family is independently selectable so a build includes only what it needs and pays nothing for
# the rest (FR-006, SC-009). `default` is untouched above, so a build selecting none of these has the
# dependency graph it had before 016.

# The finding ledger and its tools — the append-only JSONL event log. Two small additions: `sha2`
# for the stable finding identity, and `time`'s parsing/serde halves so a sighting timestamp
# round-trips through the log (the workspace `time` carries only `formatting`, which writes but
# cannot read back).
findings = ["dep:sha2", "time/parsing", "time/serde-well-known"]
# Structural, syntax-aware code search. Compiles NO grammar on its own: pick languages below.
# Requires Rust 1.88 (see the `rust-version` note on `[package]`).
astgrep = ["dep:ast-grep-core", "dep:ast-grep-language"]
# One feature per grammar. Each is a compiled C tree-sitter parser, which is why they are opt-in one
# at a time rather than arriving as a block.
astgrep-rust = ["astgrep", "ast-grep-language/tree-sitter-rust"]
astgrep-python = ["astgrep", "ast-grep-language/tree-sitter-python"]
astgrep-javascript = ["astgrep", "ast-grep-language/tree-sitter-javascript"]
astgrep-typescript = ["astgrep", "ast-grep-language/tree-sitter-typescript"]
astgrep-go = ["astgrep", "ast-grep-language/tree-sitter-go"]
astgrep-c = ["astgrep", "ast-grep-language/tree-sitter-c"]
astgrep-cpp = ["astgrep", "ast-grep-language/tree-sitter-cpp"]
astgrep-java = ["astgrep", "ast-grep-language/tree-sitter-java"]
astgrep-ruby = ["astgrep", "ast-grep-language/tree-sitter-ruby"]
# Repository history via gix (US5).
gitlog = ["dep:gix"]
# CVSS scoring (US4).
cvss = ["dep:cvss"]
# External scanner adapters + the SARIF normaliser. Implies `findings` because normalised scanner
# results have nowhere to go without the ledger.
scanners = ["findings"]
# Convenience umbrella for a security-tooling build. Grammars are still chosen explicitly.
sec = ["findings", "astgrep", "gitlog", "cvss", "scanners"]

# ── HTTP(S) interception (019-http-intercept) ──────────────────────────────────────────────────
# The interception proxy and the `http_*` tools. Default-off, so a build without it has the
# dependency graph it had before 019 (SC-009; `cargo tree` for the default build is unchanged).
# Everything network-, TLS-, SQLite- and async-I/O-shaped lives behind this flag in the application
# package; bee-core gains only types and pure functions (Constitution V, guarded by
# tests/core_deps_guard.rs). NB: `rcgen` 0.14 declares MSRV 1.88, which equals this package's own
# floor — see the `rust-version` note on `[package]` (research R20).
intercept = [
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:webpki-roots",
    "dep:httparse",
    "dep:flate2",
    "dep:similar",
    "dep:regex",
    "dep:rcgen",
    "dep:rusqlite",
    "dep:brotli-decompressor",
    "dep:ruzstd",
    "dep:json-patch",
    # Content addressing for stored bodies (blobs/<aa>/<sha256>). Already optional for `findings`.
    "dep:sha2",
    "tokio/net",
    "tokio/sync",
    "tokio/io-util",
]
# Test-only (019 T048): compiles the proxy worker's `debug.connect`/`debug.read` control frames, which
# the `http-proxy-scope` and `http-proxy-fs-deny` VM cases use to probe the proxy scope from inside.
# NEVER in a shipping build — only `test/vm/matrix.sh` enables it; every other build fails to decode
# those frames (asserted in `src/intercept/control.rs`).
vm-test = ["intercept"]

[dependencies]
bee-core = { workspace = true }
bee-userspace = { workspace = true }

rig-core = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
async-stream = "0.3"
futures-util = "0.3"
clap = { workspace = true }

# ripgrep as a pure-Rust library (wraps ripgrep's own `grep`/`ignore` core crates — no external `rg`
# binary). Used ONLY by the hidden `bee search-worker` subcommand, which the model-facing `search`
# tool execs through the sandbox: running the library in that worker — rather than in the harness —
# is what keeps every file it opens under the eBPF scope's `file_open` policy. `bstr` reads the
# `Match::text` (arbitrary bytes) the worker prints. NOT optional: `search` is a default tool, so the
# worker must exist in every build.
ripgrep-api = "0.2"
bstr = "1"
# Pinned to 17: rustyline 18 added a `unicode-width =0.2.2` dependency that conflicted with ratatui
# 0.29's `unicode-width =0.2.0` pin. ratatui-core 0.1 relaxed that to `>=0.2.0`, so the conflict is
# gone and 18 would now resolve — but unpinning is deliberately out of scope for 009 (research R1).
# rustyline 17 has the same DefaultEditor/ExternalPrinter API this crate uses (003-visual-render).
rustyline = "17"

# Visual rendering (003-visual-render, application package only — MUST NOT propagate to bee-core/bee-common,
# NFR-002/SC-019). `rhai` sync => Engine is Send+Sync so RenderTool can own it; only_i64 trims size;
# NO `unchecked` (that would disable the resource limits, FR-020). `ratatui` with no default features
# gives headless Buffer/widgets/layout without crossterm or any terminal backend (research D2/D3).
rhai = { version = "1", default-features = false, features = ["only_i64", "sync"] }
ratatui = { version = "0.30", default-features = false }

# Full-screen TUI backend (008-grid-tui). All optional + gated by the `tui` feature above so the
# default build stays headless (research D1/D10). crossterm 0.29 matches what ratatui 0.30's backend
# links: `ratatui-crossterm` defaults to `crossterm_0_29` and its cfg_if always prefers the newest
# enabled version, so `ratatui/crossterm_0_28` cannot hold the version — it only adds a *second*
# crossterm, leaving two instances driving the same tty (009 research R2/D1). Matching at 0.29 keeps
# exactly one. `event-stream` gives the async input stream. color-eyre installs the panic hook that
# restores the terminal; textwrap wraps chat to the pane width.
crossterm = { version = "0.29", features = ["event-stream"], optional = true }
color-eyre = { version = "0.6", optional = true }
textwrap = { version = "0.16", optional = true }

# Terminal effects (009-tachyonfx-effects, application package only — MUST NOT propagate to
# bee-core/bee-common, SC-009). Optional + `tui`-gated so the headless build never compiles it.
# `default-features = false` drops the `dsl` parser (and its `anpa` dep): bee builds effects from
# `EffectSpec` data in Rust, never from tachyonfx's DSL strings. `std` is re-enabled explicitly — it
# is the other half of tachyonfx's default and carries the std interop the harness needs. No I/O, no
# FFI, no `rand` — tachyonfx carries its own seeded `SimpleRng`, which is what makes the effect
# snapshots deterministic rather than flaky.
tachyonfx = { version = "0.25", default-features = false, features = [
    "std",
], optional = true }

# MCP client SDK (004-mcp-client, application package only — MUST NOT propagate to bee-core/bee-common,
# NFR-004/SC-026). Optional + gated by the `mcp` feature above. rmcp is v2.x (the spec's "1" is a
# stale major with a different API; research R1). `default-features = false` because rmcp's defaults
# enable the SERVER, not the client — we add `client` explicitly. `transport-child-process` is the
# sandboxed stdio transport (research R3); `transport-streamable-http-client-reqwest` is the
# domain-gated remote transport (US9 — rmcp 2.x removed the SSE client, so `transport = "sse"` is a
# deprecated alias routed here, research R2).
rmcp = { version = "2.2", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"], optional = true }

# Markdown → ratatui `Text` (010, application package only — MUST NOT propagate to bee-core/bee-common).
# Optional + `tui`-gated, like every other terminal dep. NOT the `ratatui-markdown` crate: that one
# still pins `ratatui ^0.29`, which cannot unify with the 0.30 the TUI is built on, so cargo would
# resolve a *second* ratatui whose `Text`/`Buffer` are different types — widgets from one cannot
# render into the other's buffer. `tui-markdown` 0.3.x moved to `ratatui-core ^0.1`, which is exactly
# what ratatui 0.30 is built on, so there is one ratatui in the tree. `highlight-code` (syntect)
# colors recognized fenced blocks; 005's objection — a second, theme-blind highlighter — is answered
# in `tui::markdown`, which picks the bundled code theme nearest the active bee theme and strips the
# highlighter's colors under `NO_COLOR`. `default-features = false` + the explicit feature keeps the
# list deliberate rather than whatever the crate's default grows into.
tui-markdown = { version = "0.3.9", default-features = false, features = ["highlight-code"], optional = true }

# Security analysis tooling (016-native-tools, application package only — MUST NOT propagate to
# bee-core/bee-common, SC-009; guarded by tests/core_deps_guard.rs). All optional and default-off, so
# a build that selects none of the `sec` features has the dependency graph it had before 016.
#
# `ast-grep-core` is the structural-search engine: matching happens on the tree-sitter parse tree, so
# a construct inside a comment or a string literal is structurally distinct from the same text in
# live code (SC-007) — which is the whole reason this is not just another regex. `ast-grep-language`
# carries the grammars; `default-features = false` turns OFF its `builtin-parser` default, which
# would pull all 27 tree-sitter grammars, every one of them compiled C. bee re-exposes them one at a
# time as `astgrep-<lang>` features so a build pays only for what it scans (research R9).
# NB: ast-grep 0.45 declares MSRV 1.88 — see the `rust-version` note on `[package]` above.
ast-grep-core = { version = "0.45", optional = true }
ast-grep-language = { version = "0.45", default-features = false, optional = true }

# Pure-Rust git for history queries (US5). `default-features = false` because gix's defaults pull far
# more than reading local history needs; `blame` gives line-origin attribution and `revision` gives
# the log walk. Deliberately NOT shelling out to `git`: that would put a binary whose flag surface
# includes `-c core.pager=<cmd>` into the exec allowlist for what is a read-only local query
# (research R11). Pin exactly — gix's API churns across minor versions more than the rest of this
# list, and an upgrade is expected to touch call sites.
# `sha1` is not optional in practice: with `default-features = false` gix selects no hash backend and
# `gix-hash` refuses to compile at all ("Please set either the `sha1` or the `sha256` feature flag").
# Object IDs are SHA-1 for every repository bee will read.
gix = { version = "=0.86.0", default-features = false, features = ["blame", "revision", "sha1"], optional = true }

# CVSS parsing and *scoring* (US4, FR-005). The model emits the vector — characterising attack
# vector, complexity, privileges, impact — which is judgement it is good at. The arithmetic is a
# multi-step floating-point calculation with scope-conditional coefficients, which it is not. This
# crate does that half. `v3` covers CVSS v3.1 Base and `v4` covers 4.0; both are on by default
# (research R10).
cvss = { version = "2.2", optional = true }

# Finding identity (US2). `FindingId` is a content hash that has to stay stable across processes and
# across bee versions, because it is what makes a re-run merge with an earlier one instead of
# duplicating it. `std::hash::DefaultHasher` explicitly does not promise that — its output may change
# between releases — so an id built on it would silently fork every ledger on upgrade. SHA-256,
# truncated to 16 bytes for a legible id, does promise it.
sha2 = { version = "0.10", optional = true }

# HTTP(S) interception (019-http-intercept, application package only — MUST NOT propagate to
# bee-core/bee-common, SC-009; guarded by tests/core_deps_guard.rs). All optional, all behind the
# default-off `intercept` feature (research R20).
#
# Already in Cargo.lock through rig-core's reqwest stack; declared here directly because the proxy
# worker uses them itself. hyper 1.x is the forwarded-traffic proxy (it preserves header case, R1);
# the crypto provider is `aws-lc-rs`, matching what the lockfile already resolved.
hyper = { version = "1", features = ["http1", "server", "client"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
http-body-util = { version = "0.1", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }
# The raw HTTP/1.1 writer frames responses with httparse (byte-exact requests, FR-018, R1).
httparse = { version = "1.10", optional = true }
# Body decoding for `http_get` slices (gzip/deflate), the replay diff, and grep over bodies.
flate2 = { version = "1.1", optional = true }
similar = { version = "2.7", optional = true }
regex = { version = "1", optional = true }
#
# New with 019. `rcgen` mints the per-session CA and leaf certificates in worker memory (`zeroize`
# wipes the key on drop, R9). `rusqlite` `bundled` is the exchange index — multi-column filtered
# history over ~100k rows, two writers (R8). `brotli-decompressor`/`ruzstd` are decode-only, pure
# Rust. `json-patch` gives the JSON body diff as pointer paths (R10).
# The lockfile holds rcgen at 0.14.9: 0.14.10 requires aws-lc-rs ^1.18, which would move the
# aws-lc-rs every default build already links (SC-009 — the default tree must not change).
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem", "zeroize"], optional = true }
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
brotli-decompressor = { version = "6", optional = true }
ruzstd = { version = "0.9", optional = true }
json-patch = { version = "4.2", optional = true }

serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
# SKILL.md frontmatter parsing (006-skills). Harness-only — MUST NOT propagate to bee-core/bee-common.
serde_yaml_ng = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
# 019: tests assert against the kernel rule budget and access bits the core compiles to.
bee-common = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "time"] }
tempfile = "3"
proptest = { workspace = true }
# Pinned frame snapshots for the TUI (008-grid-tui, research D12).
insta = "1"

# 019-http-intercept: the fixture target needs the `intercept` dependency set (hyper/rustls/rcgen).
[[example]]
name = "vuln_target"
required-features = ["intercept"]
