name: CI

# User-space crates build on STABLE (constitution Principle V / NFR-003). The eBPF `enforce` path
# needs nightly + bpf-linker + a BPF-LSM kernel, so it can't run on stock runners — it gets a
# separate required type-check job (see `enforce-check`).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. a force-push to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Link without debug info. The `mcp` test binaries pull rmcp + reqwest + rustls + aws-lc-sys, and
  # linking that tree with full debug info exhausts the runner's memory: `ld` dies with SIGBUS, on a
  # different test target each run. Debug info buys nothing in CI — no one is attaching a debugger
  # to a green build — and dropping it is what keeps the link inside the runner's budget.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain (rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain (clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: ${{ !env.ACT }} # needs GitHub's cache backend; skipped under `act` for local runs
      - name: clippy (default features)
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: clippy (mcp feature)
        run: cargo clippy --features mcp,sec,astgrep-rust --locked --all-targets -- -D warnings
      - name: clippy (headless)
        run: cargo clippy --no-default-features --locked --all-targets -- -D warnings

  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        if: ${{ !env.ACT }} # needs GitHub's cache backend; skipped under `act` for local runs
      - name: build (workspace)
        run: cargo build --workspace --locked
      - name: test (workspace, default features)
        # No ANTHROPIC_API_KEY is set, so the live-provider smoke test self-skips (it only runs when
        # the key is present). Everything else is offline (MockModel + host sandbox).
        run: cargo test --workspace --locked
      - name: test (headless)
        run: cargo test --no-default-features --locked
      - name: test (MCP and security tools)
        run: cargo test --features mcp,sec,astgrep-rust --locked
      - name: VM result parser fixtures
        run: python3 -m unittest discover -s test/vm -p 'test_*.py'
      - name: test (test-support targets)
        # 024 R1: the call-lifecycle orchestration tests drive the host sandbox's scripted audit
        # source. `test-support` is test-only and never in a shipping feature set
        # (tests/test_support_absent.rs, run in the default step above). Only the targets that need
        # the feature are run here, with and without `intercept` — the loops compile a different
        # call path (the proxy-refusal retry) under it. The 019 suites build their session through
        # the builder's test-support seam (024 T048), so they run here too.
        run: |
          cargo test --features test-support --locked \
            --test call_characterization --test call_lifecycle --test hooks_leases \
            --test operator --test stuck_detection --test finish_tool --test transcript_compat \
            --test context_compaction --test episode_progress_strings --test session_parity
          cargo test --features intercept,test-support --locked \
            --test call_characterization --test call_lifecycle --test hooks_leases \
            --test operator --test stuck_detection --test finish_tool --test transcript_compat \
            --test context_compaction --test episode_progress_strings --test session_parity \
            --test intercept_tools --test intercept_replay --test intercept_fuzz \
            --test intercept_rules --test intercept_leads --test intercept_escalation \
            --test intercept_har --test intercept_tls --test intercept_ops

  durable:
    name: durable investigation recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: ${{ !env.ACT }}
      - run: cargo fetch --locked
      - run: bash test/durable-investigation.sh

  enforce-check:
    name: enforce and concurrency type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain (outer build)
        uses: dtolnay/rust-toolchain@stable
      - name: Install nightly toolchain (bee-lsm build)
        # crates/ebpf/rust-toolchain.toml selects nightly with rust-src for the bpfel-unknown-none
        # target; build.rs shells out to `cargo +nightly build -Z build-std=core`.
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        if: ${{ !env.ACT }} # needs GitHub's cache backend; skipped under `act` for local runs
      - name: Install LLVM 18
        # bpf-linker links against a system LLVM via llvm-sys, and its build script looks for
        # `llvm-config` on PATH — the runner image ships clang but not the -dev headers or
        # llvm-config, so this job failed with "could not find llvm-config". 18 is the version
        # pinned below and the one the project is developed against; it is in Ubuntu 24.04's
        # default repos, so no apt.llvm.org bootstrap is needed. libpolly is required by llvm-sys.
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev libpolly-18-dev
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
      - name: Install bpf-linker
        # LLVM-matched linker for the BPF object. `cargo install` is cached by rust-cache across runs.
        # PINNED: bpf-linker tracks LLVM releases, so an unpinned install silently moves to a version
        # wanting an LLVM the runner does not have — which is how this job broke. 0.10.3 is the
        # version the eBPF object is actually built with locally, against LLVM 18.
        run: cargo install bpf-linker --version 0.10.3 --locked
      - name: cargo check --features enforce
        # Runs crates/userspace/build.rs, which compiles + embeds the bee-lsm object, then
        # type-checks the enforce user-space path in the application package.
        run: |
          cargo check --features enforce --tests --locked
          cargo check --features concurrent,mcp,sec,astgrep-rust --tests --locked
